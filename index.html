<meta charset="utf-8">
<title>Karam&rsquo;s Calendar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root{
    --bg:#120d11;
    --wall:#1a1318;
    --shopwall:#171015;
    --floor-1:#2a1c1e;
    --floor-2:#150e10;
    --paper:#f6eedd;
    --paper-2:#fbf5e8;
    --paper-line:#e5d9bf;
    --ink:#33261f;
    --ink-soft:#8a7a63;
    --plate:#1b1216;
    --plate-edge:#4a2a33;
    --chalk:#f5e9ec;
    --neon:#ff4049;
    --neon-glow:#ff2d3a;
    --moto:#ff6b35;
    --gold:#ffc53d;
    --pink:#e85d75;
    --petrol:#4fa3c7;

    --disp:'Impact','Arial Black','Franklin Gothic Bold',sans-serif;
    --hand:'Marker Felt','Segoe Print','Comic Sans MS',cursive;
    --body:'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--chalk);font-family:var(--body);-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--neon);outline-offset:2px;border-radius:4px}

  /* ============ THE SHOP (hero scene) ============ */
  .shop{
    position:relative;overflow:hidden;
    height:clamp(340px,42vh,460px);
    background:
      radial-gradient(ellipse at 82% 62%, rgba(255,40,60,.10), transparent 55%),
      radial-gradient(ellipse at 8% 40%, rgba(255,150,90,.14), transparent 55%),
      linear-gradient(180deg,#1c1218 0%,var(--shopwall) 60%,#140d11 100%);
  }
  .ceiling{
    position:absolute;top:0;left:0;right:0;height:44px;z-index:3;
    background:
      linear-gradient(180deg,rgba(255,40,50,.28),rgba(255,40,50,0) 80%),
      repeating-linear-gradient(90deg,#2b181c 0 22px,#1a0f12 22px 44px);
  }
  .ledstrip{
    position:absolute;top:44px;left:0;right:0;height:3px;z-index:3;
    background:var(--neon);
    box-shadow:0 0 14px 2px rgba(255,64,73,.75);
  }
  .tube{
    position:absolute;left:2.5%;top:64px;width:200px;height:6px;z-index:2;
    background:linear-gradient(90deg,#bffef0,#e9fffa 40%,#bffef0);
    border-radius:3px;transform:rotate(-2.5deg);
    box-shadow:0 0 18px 3px rgba(130,235,210,.5);
  }

  /* sunset windows */
  .window{
    position:absolute;left:3%;top:88px;width:17%;min-width:150px;height:150px;z-index:1;
    background:#2a2126;border:5px solid #2a2126;border-radius:4px;
    display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:5px;
    box-shadow:0 0 48px 6px rgba(255,150,90,.35);
  }
  .window i{
    background:linear-gradient(180deg,#8a4a78 0%,#e85d75 45%,#ff9e5e 78%,#ffc46b 100%);
    display:block;position:relative;overflow:hidden;
  }
  .window i::after{
    content:"";position:absolute;left:-10%;right:-10%;bottom:0;height:38%;
    background:#3d2547;
    clip-path:polygon(0 100%,15% 30%,32% 75%,55% 10%,78% 70%,100% 40%,100% 100%);
    opacity:.85;
  }
  .glowwash{
    position:absolute;left:0;top:80px;width:36%;height:78%;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 18% 30%,rgba(255,160,90,.20),transparent 65%);
  }

  /* wall fan */
  .fan{position:absolute;left:80.5%;top:60px;width:58px;height:58px;z-index:1}
  .fan .spin{animation:spin 12s linear infinite;transform-origin:50% 50%}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* neon sign */
  .neonwrap{
    position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:4;
    text-align:center;pointer-events:none;
  }
  .neon-txt{
    font-family:var(--disp);font-weight:400;font-size:clamp(30px,4.6vw,52px);
    letter-spacing:6px;white-space:nowrap;color:#ff6b72;
    text-shadow:0 0 5px rgba(255,64,73,.9),0 0 16px rgba(255,45,58,.8),0 0 42px rgba(255,45,58,.55);
  }
  .neon-swoosh{display:block;margin:2px auto 0;filter:drop-shadow(0 0 6px rgba(255,45,58,.9))}

  /* pegboard with tools */
  .pegboard{
    position:absolute;left:36%;top:162px;width:19%;min-width:150px;height:126px;z-index:1;
    background-color:#241c23;
    background-image:radial-gradient(rgba(0,0,0,.55) 1.6px,transparent 2px);
    background-size:16px 16px;
    border:4px solid #120c10;border-radius:3px;
  }
  .pegboard svg{width:100%;height:100%}

  /* shelf with jars */
  .shelf{position:absolute;left:79.5%;top:148px;width:12%;min-width:110px;z-index:1}
  .shelf svg{width:100%;height:auto}

  /* red tool chest */
  .toolchest{position:absolute;left:20%;bottom:64px;width:180px;z-index:2}
  .toolchest svg{width:100%;height:auto;display:block}

  /* car bay: M4 up on the lift with a mechanic under it */
  .carbay{position:absolute;left:30%;bottom:56px;width:320px;min-width:250px;z-index:3}
  .carbay svg{width:100%;height:auto;display:block}
  .droplight{animation:dlswing 3.6s ease-in-out infinite;transform-origin:172px 4px}
  @keyframes dlswing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .bulbglow{animation:bulbpulse 2.2s ease-in-out infinite}
  @keyframes bulbpulse{0%,100%{opacity:.55}50%{opacity:.95}}
  .mech-legs{animation:legwork 2.8s ease-in-out infinite;transform-origin:113px 112px}
  @keyframes legwork{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-3deg)}}
  .spark{fill:#ffd23d;opacity:0;animation:sparkfloat 1.8s ease-in-out infinite;transform-origin:center}
  .spk1{animation-delay:0s}
  .spk2{animation-delay:.55s}
  .spk3{animation-delay:1.1s}
  @keyframes sparkfloat{
    0%{opacity:0;transform:translateY(3px) scale(.5)}
    18%{opacity:1;transform:translateY(0) scale(1)}
    60%{opacity:0;transform:translateY(-15px) scale(.7)}
    100%{opacity:0;transform:translateY(-15px) scale(.7)}
  }

  /* wall tv: football night */
  .tv{
    position:absolute;left:58%;top:110px;width:15.5%;min-width:210px;z-index:2;
    background:#0d0f12;border-radius:10px;padding:7px 7px 9px;
    box-shadow:0 10px 32px rgba(0,0,0,.5),0 0 70px rgba(140,200,255,.15);
  }
  .tv .screen{position:relative;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:#2f7a3d}
  .tv .crowd{
    position:absolute;left:0;right:0;top:0;height:24%;background-color:#171821;
    background-image:radial-gradient(rgba(255,255,255,.28) .8px,transparent 1.3px);
    background-size:5px 4px;
  }
  .tv .pitch{
    position:absolute;left:0;right:0;top:24%;bottom:0;
    background-image:
      repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 2px,transparent 2px 14.5%),
      repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 12.5%,transparent 12.5% 25%),
      linear-gradient(180deg,#2e8040,#46a854);
  }
  .tv .pl{position:absolute;width:5%;aspect-ratio:1/1;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,.45)}
  .tv .scorebug{
    position:absolute;left:3.5%;bottom:6%;background:rgba(8,10,14,.88);color:#e9edf2;
    font-family:var(--mono);font-size:clamp(6.5px,.5vw,9px);letter-spacing:.4px;
    padding:2px 7px;border-radius:3px;
  }
  .tv .scorebug b{color:var(--gold);font-weight:700}
  .tv .flickov{position:absolute;inset:0;background:#cfe4ff;opacity:0;animation:tvflick 6s linear infinite;pointer-events:none}
  @keyframes tvflick{0%,90%,100%{opacity:0}92%{opacity:.06}94%{opacity:.02}96%{opacity:.05}}

  /* couch + sleeping cavalier */
  .couch{position:absolute;right:2%;bottom:40px;width:24.5%;min-width:300px;z-index:2}
  .couch svg{width:100%;height:auto;display:block}
  .bowl{position:absolute;right:27.5%;bottom:42px;width:74px;z-index:2}
  .bowl svg{width:100%;height:auto;display:block}
  .bowlname{font-family:var(--disp);letter-spacing:1.5px;fill:#f6eedd;font-size:9.5px}
  .breath{animation:breathe 3s ease-in-out infinite alternate;transform-origin:120px 132px}
  @keyframes breathe{to{transform:translateY(-2.2px)}}
  .zz{font-family:var(--hand);fill:#c9b7d4;opacity:0;animation:zfloat 4.2s ease-in-out infinite}
  .z1{font-size:17px}
  .z2{font-size:13px;animation-delay:1.4s}
  .z3{font-size:10px;animation-delay:2.8s}
  @keyframes zfloat{
    0%{opacity:0;transform:translateY(8px)}
    20%{opacity:.85}
    60%{opacity:0;transform:translateY(-12px)}
    100%{opacity:0;transform:translateY(-12px)}
  }

  .shopfloor{
    position:absolute;left:0;right:0;bottom:0;height:78px;z-index:0;
    background:linear-gradient(180deg,var(--floor-1),var(--floor-2));
  }
  .pool-r{
    position:absolute;right:0;bottom:0;width:44%;height:70px;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 60% 80%,rgba(255,40,60,.16),transparent 70%);
  }
  .pool-l{
    position:absolute;left:0;bottom:0;width:36%;height:70px;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 30% 80%,rgba(255,160,90,.13),transparent 70%);
  }
  .pool-tv{
    position:absolute;left:54%;bottom:0;width:24%;height:64px;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 85%,rgba(150,200,255,.10),transparent 70%);
  }

  .shopclock{
    position:absolute;right:16px;top:60px;z-index:4;
    background:rgba(18,10,14,.78);border:2px solid var(--plate-edge);border-radius:6px;
    padding:7px 12px;font-family:var(--mono);font-size:12.5px;letter-spacing:1px;
    color:var(--gold);font-variant-numeric:tabular-nums;
  }

  /* ============ THE WALL ============ */
  .wall{
    background-color:var(--wall);
    background-image:
      radial-gradient(rgba(0,0,0,.45) 2.2px,transparent 2.7px),
      linear-gradient(180deg,rgba(255,45,58,.05),transparent 240px);
    background-size:30px 30px,100% 100%;
    padding:clamp(18px,3vw,40px) clamp(14px,2vw,40px) 0;
  }
  .bench-area{max-width:1720px;margin:0 auto;display:grid;
    grid-template-columns:minmax(0,2.1fr) minmax(0,1fr);gap:32px;align-items:start}

  /* ---- wall calendar ---- */
  .wallcal{
    background:var(--paper);color:var(--ink);border-radius:6px 6px 12px 12px;
    box-shadow:0 24px 50px rgba(5,2,8,.6),0 3px 0 rgba(0,0,0,.25);
  }
  .binding{
    display:flex;justify-content:center;gap:120px;align-items:center;height:40px;
    background:var(--plate);border-radius:6px 6px 0 0;
  }
  .binding i{width:16px;height:16px;border-radius:50%;border:3px solid #7a5560;background:var(--paper)}
  .calhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 4px;flex-wrap:wrap}
  .navbtn{
    width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);background:transparent;
    color:var(--ink);font-size:18px;line-height:1;display:grid;place-items:center;flex:none;
  }
  .navbtn:hover{background:var(--ink);color:var(--paper)}
  .monthplate{
    position:relative;background:var(--plate);color:var(--paper);border-radius:6px;
    padding:8px 30px 9px;font-family:var(--disp);font-size:clamp(17px,2.2vw,24px);
    letter-spacing:2px;text-transform:uppercase;font-variant-numeric:tabular-nums;
    text-align:center;flex:0 1 auto;min-width:0;white-space:nowrap;
  }
  .monthplate::before,.monthplate::after{
    content:"";position:absolute;top:50%;width:7px;height:7px;border-radius:50%;
    background:#7a4550;transform:translateY(-50%);
  }
  .monthplate::before{left:10px}.monthplate::after{right:10px}
  .headtools{display:flex;gap:8px;align-items:center;flex:none}
  .viewswitch{display:flex;border:2px solid var(--ink);border-radius:6px;overflow:hidden}
  .vbtn{
    border:none;background:transparent;color:var(--ink);padding:7px 12px;
    font-family:var(--mono);font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;
  }
  .vbtn.act{background:var(--ink);color:var(--paper)}
  .todaybtn{
    border:2px dashed var(--ink-soft);background:transparent;color:var(--ink);
    font-family:var(--mono);font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;
    padding:7px 10px;border-radius:5px;
  }
  .todaybtn:hover{border-color:var(--neon);color:var(--neon)}

  /* month view */
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:12px 14px 2px}
  .dow span{font-family:var(--mono);font-size:10.5px;letter-spacing:1.5px;color:var(--ink-soft);text-align:center;text-transform:uppercase}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px 14px 18px}
  .day{
    position:relative;
    background:var(--paper-2);border:1px solid #e8dcc2;border-radius:4px;
    min-height:clamp(88px,11vh,150px);padding:6px 6px 5px;text-align:left;display:flex;flex-direction:column;gap:2px;
    color:var(--ink);font-family:var(--body);min-width:0;
  }
  .day:hover{border-color:var(--neon);box-shadow:inset 0 0 0 1px var(--neon)}
  .day.other{opacity:.42}
  .day .num{
    font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;
    width:24px;height:24px;display:inline-grid;place-items:center;flex:none;
  }
  .day.today .num{
    border:2.5px solid var(--neon);border-radius:52% 46% 55% 48%;
    transform:rotate(-5deg);font-weight:700;color:var(--neon);
  }
  .day.pastday .num{text-decoration:line-through;color:#a5937a}
  .day.pastday::after{
    content:"";position:absolute;inset:5px;pointer-events:none;border-radius:4px;
    background:linear-gradient(to top right,transparent 46.5%,rgba(51,38,31,.30) 48.5%,rgba(51,38,31,.30) 51.5%,transparent 53.5%);
  }
  .chip{
    display:block;font-size:11px;line-height:1.35;padding:1.5px 5px 1.5px 6px;border-radius:3px;
    border-left:4px solid var(--cc,var(--neon));
    background:color-mix(in srgb,var(--cc,var(--neon)) 16%,var(--paper-2));
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);
    cursor:pointer;
  }
  .chip:hover{background:color-mix(in srgb,var(--cc,var(--neon)) 32%,var(--paper-2))}
  .chip.past{opacity:.45}
  .chip time{font-family:var(--mono);font-size:10px;margin-right:3px}
  .chip .rep{font-size:10px;opacity:.7;margin-right:2px}
  .more{font-size:10px;color:var(--ink-soft);font-family:var(--mono)}

  /* week view */
  .weekwrap{display:none;padding:10px 14px 18px}
  .weekwrap.act{display:block}
  .wk-head{display:grid;grid-template-columns:52px repeat(7,1fr)}
  .wk-h{text-align:center;padding:4px 2px 6px}
  .wk-h .wdow{font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;color:var(--ink-soft);text-transform:uppercase}
  .wk-h .wnum{
    font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums;
    display:inline-grid;place-items:center;width:30px;height:30px;margin-top:2px;
  }
  .wk-h.wtoday .wnum{
    border:2.5px solid var(--neon);border-radius:52% 46% 55% 48%;
    transform:rotate(-5deg);font-weight:700;color:var(--neon);
  }
  .wk-h.wpast .wnum{text-decoration:line-through;color:#a5937a}
  .wk-allday{display:grid;grid-template-columns:52px repeat(7,1fr);border-bottom:2px solid #e0d3b6;padding-bottom:4px}
  .wk-allday .adlbl{font-family:var(--mono);font-size:8.5px;letter-spacing:1px;color:var(--ink-soft);text-transform:uppercase;align-self:center;text-align:right;padding-right:6px}
  .wk-allday .adcell{min-height:20px;padding:1px 3px;display:flex;flex-direction:column;gap:2px;min-width:0}
  .wk-body{
    display:grid;grid-template-columns:52px repeat(7,1fr);
    max-height:58vh;overflow-y:auto;position:relative;
  }
  .wk-gutter{position:relative}
  .wk-gutter div{
    height:44px;font-family:var(--mono);font-size:9.5px;color:var(--ink-soft);
    text-align:right;padding-right:6px;transform:translateY(-6px);
  }
  .wk-col{
    position:relative;border-left:1px solid #eadfc6;height:792px;cursor:pointer;
    background:repeating-linear-gradient(180deg,transparent 0 43px,#eadfc6 43px 44px);
  }
  .wk-col.wtodaycol{background-color:rgba(255,64,73,.04)}
  .wev{
    position:absolute;left:2px;right:3px;border-radius:4px;overflow:hidden;cursor:pointer;z-index:2;
    border-left:4px solid var(--cc,var(--neon));
    background:color-mix(in srgb,var(--cc,var(--neon)) 22%,var(--paper-2));
    color:var(--ink);font-size:10.5px;line-height:1.25;padding:2px 4px;
    box-shadow:0 1px 3px rgba(51,38,31,.18);
  }
  .wev:hover{background:color-mix(in srgb,var(--cc,var(--neon)) 38%,var(--paper-2))}
  .wev.past{opacity:.5}
  .wev time{display:block;font-family:var(--mono);font-size:9px;opacity:.8}
  .nowline{
    position:absolute;left:0;right:0;height:2px;background:var(--neon);z-index:5;pointer-events:none;
    box-shadow:0 0 6px rgba(255,64,73,.9);
  }
  .nowline::before{
    content:"";position:absolute;left:-4px;top:-3.5px;width:9px;height:9px;border-radius:50%;background:var(--neon);
  }

  /* ---- sidebar ---- */
  .sidebar{display:flex;flex-direction:column;gap:30px;min-width:0}
  .pitboard{
    background:var(--plate);border:3px solid var(--plate-edge);border-radius:10px;
    padding:16px 18px 14px;box-shadow:0 20px 44px rgba(5,2,8,.55);
  }
  .boardtitle{
    margin:0 0 4px;font-family:var(--disp);font-weight:400;font-size:21px;letter-spacing:2.5px;
    color:var(--paper);text-transform:uppercase;
  }
  .boardtitle::after{content:"";display:block;width:56px;height:4px;background:var(--neon);margin-top:5px;border-radius:2px}
  .upnext{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
  .upnext li{display:flex;align-items:baseline;gap:10px;min-width:0}
  .upnext .when{font-family:var(--mono);font-size:11px;color:var(--gold);flex:none;width:86px;font-variant-numeric:tabular-nums}
  .upnext .what{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .upnext .what .rep{font-size:11px;opacity:.65;margin-left:4px}
  .upnext .cd{
    flex:none;font-family:var(--mono);font-size:10.5px;color:var(--neon);
    border:1.5px solid var(--neon);border-radius:99px;padding:2px 8px;font-variant-numeric:tabular-nums;
  }
  .upnext .empty{color:#a5808a;font-size:13.5px;font-style:italic}

  .notepad{
    position:relative;background:var(--paper);color:var(--ink);border-radius:3px;
    transform:rotate(-.8deg);
    box-shadow:0 20px 44px rgba(5,2,8,.55);
    background-image:
      linear-gradient(90deg,transparent 33px,rgba(214,88,88,.45) 33px,rgba(214,88,88,.45) 35px,transparent 35px),
      repeating-linear-gradient(180deg,transparent 0 26px,var(--paper-line) 26px 28px);
    padding:18px 18px 20px 46px;
  }
  .notepad::before,.notepad::after{
    content:"";position:absolute;top:-10px;width:84px;height:26px;
    background:rgba(255,252,240,.5);border:1px solid rgba(0,0,0,.08);
    box-shadow:0 2px 5px rgba(0,0,0,.18);
  }
  .notepad::before{left:14px;transform:rotate(-6deg)}
  .notepad::after{right:14px;transform:rotate(5deg)}
  .notepad h2{
    margin:0;font-family:var(--disp);font-weight:400;font-size:21px;
    letter-spacing:2.5px;text-transform:uppercase;color:var(--ink);
  }
  .notepad h2 em{font-style:normal;color:var(--neon)}
  .notehint{margin:1px 0 2px;font-family:var(--mono);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:#b3a180}
  .noteform{display:flex;gap:8px;align-items:center;margin:8px 0 4px}
  .noteform input{
    flex:1;min-width:0;background:transparent;border:none;border-bottom:2px dashed #c9b995;
    font-family:var(--hand);font-size:17px;color:var(--ink);padding:3px 2px;
  }
  .noteform input::placeholder{color:#b3a180}
  .noteform input:focus{outline:none;border-bottom-color:var(--neon)}
  .noteform button{
    flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);
    background:transparent;color:var(--ink);font-size:19px;line-height:1;
  }
  .noteform button:hover{background:var(--neon);border-color:var(--neon);color:#fff}
  .notes{list-style:none;margin:6px 0 0;padding:0}

<script>
(function(){
  'use strict';
  var $ = function(s){ return document.querySelector(s); };
  var KEY = 'garage-hq-v1';

  var DEFAULT_TAGS = [
    { id:'school', label:'School', color:'#4fa3c7' },
    { id:'intern', label:'Internship', color:'#ffc53d' },
    { id:'family', label:'Family', color:'#e85d75' },
    { id:'ride', label:'Ride & Sports', color:'#ff6b35' }
  ];
  var TAG_PALETTE = ['#4fa3c7','#ffc53d','#e85d75','#ff6b35','#7ddb6a','#b48ee0','#5fd0c0','#e0a458','#6a8fe0','#e05f9a'];
  function tagColor(id){
    var t = state.tags.find(function(x){ return x.id === id; });
    return t ? t.color : '#ff4049';
  }
  function fmtRepeat(e){
    var r = e.repeat || 'none';
    if(r === 'none') return '';
    var tail = e.until ? ' til ' + e.until.slice(5).replace('-','/') : '';
    if(r === 'monthly') return 'monthly' + tail;
    if(r === 'daily') return 'every day' + tail;
    if(r === 'weekdays') return 'Mon\u2013Fri' + tail;
    if(r === 'biweekly') return 'every 2 wks' + tail;
    var days = (e.days && e.days.length) ? e.days.slice() : [];
    if(!days.length) return 'weekly' + tail;
    if(days.length === 7) return 'every day' + tail;
    var sorted = [1,2,3,4,5,6,0].filter(function(d){ return days.indexOf(d) !== -1; });
    if(sorted.join(',') === '1,2,3,4,5') return 'Mon\u2013Fri' + tail;
    var L = {0:'Su',1:'M',2:'Tu',3:'W',4:'Th',5:'F',6:'Sa'};
    return sorted.map(function(d){ return L[d]; }).join('\u00b7') + tail;
  }
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var HOUR_START = 6, HOUR_END = 23, HH = 44; // week grid: 6am-11pm, 44px/hour

  /* ---------- state ---------- */
  function load(){
    try{
      var s = JSON.parse(localStorage.getItem(KEY));
      if(s && typeof s === 'object'){
        return {
          events: Array.isArray(s.events) ? s.events : [],
          notes: Array.isArray(s.notes) ? s.notes : [],
          notified: s.notified || {},
          sound: !!s.sound,
          tags: (Array.isArray(s.tags) && s.tags.length) ? s.tags : DEFAULT_TAGS.slice()
        };
      }
    }catch(e){}
    return { events:[], notes:[], notified:{}, sound:false, tags: DEFAULT_TAGS.slice() };
  }
  var state = load();
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function esc(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ---------- date helpers ---------- */
  function pad(n){ return String(n).padStart(2,'0'); }
  function dstr(y,m,d){ return y + '-' + pad(m+1) + '-' + pad(d); }
  function dstrOf(d){ return dstr(d.getFullYear(), d.getMonth(), d.getDate()); }
  function todayStr(){ return dstrOf(new Date()); }
  function addDays(ds, n){ var d = new Date(ds + 'T12:00'); d.setDate(d.getDate() + n); return dstrOf(d); }
  function mondayOf(ds){ var d = new Date(ds + 'T12:00'); var w = (d.getDay() + 6) % 7; return addDays(ds, -w); }
  function evDT(ds, time){ return new Date(ds + 'T' + (time || '23:59')); }
  function mins(t){ var p = t.split(':'); return (+p[0])*60 + (+p[1]); }
  function fmtTime(t){
    if(!t) return 'all day';
    var hm = t.split(':'), h = +hm[0], m = hm[1];
    var ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if(h === 0) h = 12;
    return h + ':' + m + ' ' + ap;
  }
  function fmtHour(h){ var ap = h < 12 ? 'AM' : 'PM'; var x = h % 12; if(x === 0) x = 12; return x + ' ' + ap; }
  function fmtShort(t){
    var hm = t.split(':'), h = +hm[0], m = hm[1];
    var ap = h >= 12 ? 'p' : 'a';
    h = h % 12; if(h === 0) h = 12;
    return h + (m !== '00' ? ':' + m : '') + ap;
  }
  function fmtCountdown(ms){
    if(ms <= 0) return 'now!';
    var m = Math.ceil(ms/60000);
    if(m < 60) return 'in ' + m + 'm';
    var h = Math.floor(m/60);
    if(h < 24) return 'in ' + h + 'h ' + (m%60) + 'm';
    var d = Math.floor(h/24);
    return 'in ' + d + 'd ' + (h%24) + 'h';
  }

  /* ---------- recurrence ---------- */
  function occursOn(e, ds){
    if(ds === e.date) return true;
    var r = e.repeat || 'none';
    if(r === 'none' || ds < e.date) return false;
    if(e.until && ds > e.until) return false;
    var d1 = new Date(e.date + 'T12:00'), d2 = new Date(ds + 'T12:00');
    var diff = Math.round((d2 - d1) / 86400000);
    if(r === 'daily') return true;
    if(r === 'weekdays'){ var w = d2.getDay(); return w >= 1 && w <= 5; }
    if(r === 'weekly'){
      var days = (e.days && e.days.length) ? e.days : [d1.getDay()];
      return days.indexOf(d2.getDay()) !== -1;
    }
    if(r === 'biweekly') return diff % 14 === 0;
    if(r === 'monthly') return d2.getDate() === d1.getDate();
    return false;
  }
  function nextOcc(e, graceMs){
    var threshold = Date.now() - graceMs;
    if(!e.repeat || e.repeat === 'none'){
      var t = evDT(e.date, e.time).getTime();
      return t > threshold ? { ds: e.date, t: t } : null;
    }
    var n = new Date();
    var start = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    for(var i = 0; i < 400; i++){
      var d = new Date(start.getTime() + i * 86400000);
      var ds = dstrOf(d);
      if(ds < e.date) continue;
      if(!occursOn(e, ds)) continue;
      var t2 = evDT(ds, e.time).getTime();
      if(t2 > threshold) return { ds: ds, t: t2 };
    }
    return null;
  }
  function eventsOn(ds){
    return state.events.filter(function(e){ return occursOn(e, ds); })
      .sort(function(a,b){ return (a.time||'99') < (b.time||'99') ? -1 : 1; });
  }

  /* ---------- views ---------- */
  var now0 = new Date();
  var mode = 'month';
  var view = { y: now0.getFullYear(), m: now0.getMonth() };
  var weekStart = mondayOf(todayStr());
  var nowlineEl = null;
  var lastToday = todayStr();

  function renderCalendar(){
    if(mode === 'month'){
      $('#dowrow').style.display = '';
      $('#grid').style.display = '';
      $('#weekwrap').classList.remove('act');
      renderMonth();
    } else {
      $('#dowrow').style.display = 'none';
      $('#grid').style.display = 'none';
      $('#weekwrap').classList.add('act');
      renderWeek();
    }
  }

  /* ----- month view (Monday first) ----- */
  function renderMonth(){
    $('#monthplate').textContent = MONTHS[view.m].toUpperCase() + ' ' + view.y;
    var grid = $('#grid');
    grid.innerHTML = '';
    var first = (new Date(view.y, view.m, 1).getDay() + 6) % 7;
    var dim = new Date(view.y, view.m+1, 0).getDate();
    var dimPrev = new Date(view.y, view.m, 0).getDate();
    var tstr = todayStr();
    var nowMs = Date.now();

    for(var i = 0; i < 42; i++){
      var dayNum, y = view.y, m = view.m, other = false;
      if(i < first){ dayNum = dimPrev - first + 1 + i; m = view.m - 1; other = true; }
      else if(i - first < dim){ dayNum = i - first + 1; }
      else { dayNum = i - first - dim + 1; m = view.m + 1; other = true; }
      if(m < 0){ m = 11; y--; } if(m > 11){ m = 0; y++; }
      var ds = dstr(y, m, dayNum);

      var evs = eventsOn(ds);
      var cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'day' + (other ? ' other' : '') + (ds === tstr ? ' today' : '') + (ds < tstr ? ' pastday' : '');
      cell.setAttribute('aria-label', DOW_SHORT[new Date(y,m,dayNum).getDay()] + ' ' + MONTHS[m] + ' ' + dayNum + (evs.length ? ', ' + evs.length + ' event' + (evs.length>1?'s':'') : ''));

      var html = '<span class="num">' + dayNum + '</span><span class="chipwrap">';
      evs.slice(0,3).forEach(function(e){
        var past = e.time && evDT(ds, e.time).getTime() < nowMs;
        html += '<span class="chip' + (past ? ' past' : '') + '" data-id="' + e.id + '" style="--cc:' + tagColor(e.cat) + '" title="' + esc(e.title) + '">'
          + (e.repeat && e.repeat !== 'none' ? '<span class="rep">&#8635;</span>' : '')
          + (e.time ? '<time>' + fmtShort(e.time) + '</time>' : '') + esc(e.title) + '</span>';
      });
      html += '</span>';
      if(evs.length > 3) html += '<span class="more">+' + (evs.length-3) + ' more</span>';
      cell.innerHTML = html;
      cell.addEventListener('click', function(dsCopy){ return function(ev){
        var ch = ev.target.closest('.chip');
        if(ch && ch.dataset.id) openEditor(ch.dataset.id, dsCopy);
        else openDay(dsCopy);
      }; }(ds));
      grid.appendChild(cell);
    }
  }

  /* ----- week view (Google-style time grid) ----- */
  function weekTitle(ws){
    var d0 = new Date(ws + 'T12:00');
    var d6 = new Date(addDays(ws, 6) + 'T12:00');
    var m0 = MONTHS[d0.getMonth()].slice(0,3).toUpperCase();
    var m6 = MONTHS[d6.getMonth()].slice(0,3).toUpperCase();
    if(d0.getMonth() === d6.getMonth()) return m0 + ' ' + d0.getDate() + ' – ' + d6.getDate() + ', ' + d6.getFullYear();
    return m0 + ' ' + d0.getDate() + ' – ' + m6 + ' ' + d6.getDate() + ', ' + d6.getFullYear();
  }

  function renderWeek(){
    $('#monthplate').textContent = weekTitle(weekStart);
    var tstr = todayStr();
    var nowMs = Date.now();
    var days = [];
    for(var i = 0; i < 7; i++) days.push(addDays(weekStart, i));

    // headers
    var hh = '<div></div>';
    days.forEach(function(ds){
      var d = new Date(ds + 'T12:00');
      hh += '<div class="wk-h' + (ds === tstr ? ' wtoday' : '') + (ds < tstr ? ' wpast' : '') + '">'
        + '<div class="wdow">' + DOW_SHORT[d.getDay()] + '</div>'
        + '<span class="wnum">' + d.getDate() + '</span></div>';
    });
    $('#wkhead').innerHTML = hh;

    // all-day row
    var ah = '<div class="adlbl">all day</div>';
    days.forEach(function(ds){
      var chips = '';
      eventsOn(ds).forEach(function(e){
        if(e.time) return;
        chips += '<span class="chip" data-id="' + e.id + '" data-ds="' + ds + '" style="--cc:' + tagColor(e.cat) + '" title="' + esc(e.title) + '">'
          + (e.repeat && e.repeat !== 'none' ? '<span class="rep">&#8635;</span>' : '') + esc(e.title) + '</span>';
      });
      ah += '<div class="adcell">' + chips + '</div>';
    });
    $('#wkallday').innerHTML = ah;

    // body
    var body = $('#wkbody');
    body.innerHTML = '';
    var gutter = document.createElement('div');
    gutter.className = 'wk-gutter';
    var gl = '';
    for(var h = HOUR_START; h <= HOUR_END; h++) gl += '<div>' + fmtHour(h) + '</div>';
    gutter.innerHTML = gl;
    body.appendChild(gutter);

    nowlineEl = null;
    days.forEach(function(ds){
      var col = document.createElement('div');
      col.className = 'wk-col' + (ds === tstr ? ' wtodaycol' : '');
      col.dataset.ds = ds;
      var inner = '';
      eventsOn(ds).forEach(function(e){
        if(!e.time) return;
        var startM = mins(e.time);
        var endM = e.end ? mins(e.end) : startM + 60;
        if(endM <= startM) endM = startM + 60;
        var top = (startM - HOUR_START*60) / 60 * HH;
        var hgt = (endM - startM) / 60 * HH;
        if(top < 0){ hgt += top; top = 0; }
        var maxH = (HOUR_END - HOUR_START + 1) * HH;
        if(top + hgt > maxH) hgt = maxH - top;
        if(hgt < 20) hgt = 20;
        var past = evDT(ds, e.time).getTime() < nowMs;
        inner += '<div class="wev' + (past ? ' past' : '') + '" data-id="' + e.id + '" data-ds="' + ds + '" style="--cc:' + tagColor(e.cat) + ';top:' + top + 'px;height:' + hgt + 'px" title="' + esc(e.title) + '">'
          + '<time>' + fmtTime(e.time) + (e.end ? ' – ' + fmtTime(e.end) : '') + '</time>' + esc(e.title) + '</div>';
      });
      col.innerHTML = inner;
      col.addEventListener('click', function(ev){
        var wev = ev.target.closest('.wev');
        if(wev){ openEditor(wev.dataset.id, wev.dataset.ds); return; }
        var rect = col.getBoundingClientRect();
        var hour = Math.floor((ev.clientY - rect.top) / HH) + HOUR_START;
        if(hour < 0 || hour > 23) hour = 9;
        openDay(col.dataset.ds, pad(hour) + ':00');
      });
      body.appendChild(col);

      if(ds === tstr){
        var nl = document.createElement('div');
        nl.className = 'nowline';
        col.appendChild(nl);
        nowlineEl = nl;
      }
    });
    updateNowline();
    // scroll to ~8am or just above the now line
    var target = 2 * HH;
    if(nowlineEl){
      var t = parseFloat(nowlineEl.style.top || '0');
      if(t > 0) target = Math.max(0, t - 3*HH);
    }
    body.scrollTop = target;
  }

  function updateNowline(){
    if(!nowlineEl) return;
    var n = new Date();
    var top = ((n.getHours()*60 + n.getMinutes()) - HOUR_START*60) / 60 * HH;
    var maxH = (HOUR_END - HOUR_START + 1) * HH;
    if(top < 0 || top > maxH){ nowlineEl.style.display = 'none'; }
    else { nowlineEl.style.display = ''; nowlineEl.style.top = top + 'px'; }
  }

  function startNoteEdit(span){
    var li = span.closest('li');
    var n = state.notes.find(function(x){ return x.id === li.dataset.id; });
    if(!n) return;
    var inp = document.createElement('input');
    inp.type = 'text'; inp.className = 'txt-edit'; inp.maxLength = 120; inp.value = n.text;
    span.replaceWith(inp);

      if(done) return; done = true;

      else state.notes = state.notes.filter(function(x){ return x.id !== n.id; });
      save(); renderNotes();

    inp.addEventListener('keydown', function(k){

      else if(k.key === 'Escape'){ done = true; renderNotes(); }
    });
    inp.addEventListener('blur', commit);

  /* ---------- alarms ---------- */
  var audioCtx = null;
  function horn(){
    if(!state.sound) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      [660, 880].forEach(function(freq, i){
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'square'; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, audioCtx.currentTime + i*0.18);
        g.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + i*0.18 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + i*0.18 + 0.16);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(audioCtx.currentTime + i*0.18);
        o.stop(audioCtx.currentTime + i*0.18 + 0.2);
      });
    }catch(e){}
  }

  function toast(head, bodyHtml){

  function fire(e, t){
    var now = Date.now();
    var msg = esc(e.title) + ' &mdash; ' + fmtTime(e.time) + ' (' + fmtCountdown(t - now) + ')';
    toast('&#128276; Coming up', msg);
    horn();
    if('Notification' in window && Notification.permission === 'granted'){
      try{
        new Notification('🔧 Karam\'s Calendar', { body: e.title + ' — ' + fmtTime(e.time) + ' ' + fmtCountdown(t - now) });
      }catch(err){}
    }
  }

  function checkReminders(){
    var now = Date.now();
    var changed = false;
    state.events.forEach(function(e){
      if(!e.time) return;
      var occ = nextOcc(e, 2*60000);
      if(!occ) return;
      var key = e.id + '@' + occ.ds;
      var lead = (e.lead || 0) * 60000;
      if(now >= occ.t - lead && now <= occ.t + 2*60000 && !state.notified[key]){
        state.notified[key] = 1;
        changed = true;
        fire(e, occ.t);
      }
    });
    var old = new Date(now - 2*86400000);
    var oldDs = dstrOf(old);
    Object.keys(state.notified).forEach(function(k){
      var parts = k.split('@');
      var e = state.events.find(function(x){ return x.id === parts[0]; });
      if(!e || !parts[1] || parts[1] < oldDs){ delete state.notified[k]; changed = true; }
    });
    if(changed) save();
  }

  /* ---------- workbench controls ---------- */
  var notifbtn = $('#notifbtn');
  function renderNotifBtn(){
    var dot = '<span class="dot"></span>';
    if(!('Notification' in window)){
      notifbtn.innerHTML = dot + 'Alarms: toasts only';
      notifbtn.disabled = true;
      return;
    }
    notifbtn.classList.remove('on','blocked');
    if(Notification.permission === 'granted'){
      notifbtn.classList.add('on');
      notifbtn.innerHTML = dot + 'Shop alarms: on';
    } else if(Notification.permission === 'denied'){
      notifbtn.classList.add('blocked');
      notifbtn.innerHTML = dot + 'Alarm blocked in browser';
    } else {
      notifbtn.innerHTML = dot + 'Turn on shop alarms';
    }
  }
  notifbtn.addEventListener('click', function(){
    if(!('Notification' in window)) return;
    Notification.requestPermission().then(renderNotifBtn);
  });

  var soundbtn = $('#soundbtn');
  function renderSoundBtn(){
    soundbtn.classList.toggle('on', state.sound);
    soundbtn.innerHTML = '<span class="dot"></span>Horn: ' + (state.sound ? 'on' : 'off');
  }
  soundbtn.addEventListener('click', function(){
    state.sound = !state.sound;
    save(); renderSoundBtn();
    if(state.sound) horn();
  });

  $('#testbtn').addEventListener('click', function(){
    toast('&#128276; Test alarm', 'This is what a reminder looks like. Horn honks if it&rsquo;s on.');
    horn();
    if('Notification' in window && Notification.permission === 'granted'){
      try{ new Notification('🔧 Karam\'s Calendar', { body: 'Test alarm — you’re all set.' }); }catch(err){}
    }
  });

  /* ---------- boot ---------- */
  renderCalendar();
  renderNotes();
  renderUpcoming();
  renderClock();
  renderNotifBtn();
  renderSoundBtn();
  checkReminders();
  setInterval(function(){ renderClock(); }, 1000);
  setInterval(function(){
    renderUpcoming();
    checkReminders();
    updateNowline();
    var t = todayStr();
    if(t !== lastToday){ lastToday = t; renderCalendar(); }
  }, 20000);
})();
</script>
